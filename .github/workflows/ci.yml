# CI: PR・mainへのpushで内容を検証する。
# 本番配信はCloudflare Workers Builds（Production branch: main）が担当し、
# このワークフローは本番と同じビルドの検証を担当する。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # 同じPRへの連続pushで古い検証を残さず、最新コミットだけを公開判定に使う。
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # 本番と同じパス構成（ルート配信）で検証する。
  # SITE_URL は設定しない＝ビルドは noindex 付きになるが、検証には影響しない。
  BASE_PATH: /

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 依存関係のインストール
        run: npm ci
      - name: Cloudflare本番ターゲット検証
        run: npm run verify:deploy-config
      - name: コンテンツスキーマ・重複ID・循環検査
        run: node scripts/validate-content.mjs
      - name: 記事画像・埋め込み検査
        run: npm run validate:media
      - name: 数式のKaTeX描画検査
        run: npm run audit:math
      - name: 数学記事directive境界検査
        run: npm run check:math-directives
      - name: TypeScriptチェック
        run: npx astro check
      - name: Lint
        run: npm run lint
      - name: Formatチェック
        run: npm run format:check
      - name: 単体テスト
        run: npm test
      - name: ビルド（下書きは除外される）
        run: npm run build
      - name: ビルドSHA検証
        run: |
          expected="$(git rev-parse HEAD)"
          actual="$(node -p 'require("./dist/build-info.json").commit')"
          test "$actual" = "$expected"
      - name: 内部リンク検証
        run: node scripts/check-links.mjs dist "$BASE_PATH"
      # `--with-deps` は毎回 apt を叩くため、ミラーが詰まるとジョブ全体が
      # タイムアウトする（CI #191 はここで14分24秒待ってから打ち切られた）。
      # ubuntu-latest のランナー画像には Chromium の共有ライブラリが入って
      # いるので apt は使わず、ブラウザ本体だけをキャッシュ付きで入れる。
      - name: Playwrightのバージョンを取得
        id: playwright-version
        run: |
          echo "value=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Playwrightブラウザのキャッシュ
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.value }}
      - name: Playwrightブラウザ導入
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: E2E・アクセシビリティ検査 (Playwright + axe)
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:4321
      - name: Lighthouse CI（品質検査）
        run: |
          npm install -g @lhci/cli
          npx astro preview --port 4321 &
          sleep 3
          lhci collect --url="http://localhost:4321/" --url="http://localhost:4321/atlas/ja/" --numberOfRuns=1 || true
          lhci assert --preset=lighthouse:no-pwa --assertions.categories:accessibility=error || true
